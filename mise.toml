# The blueprint's tool pins for every environment. This integration's own tools go in .config/mise/conf.d/project.toml,
# which template sync leaves alone; personal overrides in the gitignored mise.local.toml.
min_version = "2026.10.22"

# Unset, these fall back to a source build when no precompiled one matches; false makes that an error instead.
[settings]
python.compile = false
node.compile = false

[tools]
# Follows the Python version Home Assistant requires.
python = "3.14.9"
uv = "0.13.6"
shellcheck = "0.11.0"
shfmt = "3.14.1"
jq = "1.8.2"
yq = "4.54.1"
ripgrep = "15.2.0"
fd = "10.5.0"
betterleaks = "1.9.0"

# script/setup/bootstrap creates the venv and links it here in every environment; mise puts it ahead of its own Python.
[env]
_.python.venv = { path = ".venv" }

# What Renovate would raise, without opening a pull request. Renovate's engines name an older Node major than the
# environment may have, so the task brings its own; mise installs task tools on first use, never with `mise install`.
[tasks.renovate-dry-run]
description = "Preview committed dependency updates in an isolated clone, without a pull request"
# @yarnpkg/libzip 3.2.2, a Renovate dependency, lost the provenance 3.2.1 had, which mise's npm trust policy refuses.
tools = { node = "24.22.2", "npm:renovate" = { version = "44.193.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] } }
shell = "bash -c"
run = '''
set -euo pipefail
token="${RENOVATE_GITHUB_COM_TOKEN:-$(gh auth token 2>/dev/null || true)}"
if [[ -z "$token" ]]; then
  echo "renovate-dry-run: no GitHub token; run gh auth login, or set RENOVATE_GITHUB_COM_TOKEN" >&2
  exit 1
fi
preview=$(mktemp -d)
trap 'rm -rf "$preview"' EXIT
git clone --quiet --no-hardlinks --local "$PWD" "$preview/repository"
python3 - "$preview/repository/.github/renovate.json" <<'PREVIEW_CONFIG'
import json
from pathlib import Path
import sys
path = Path(sys.argv[1])
config = json.loads(path.read_text(encoding="utf-8"))
config["enabled"] = True
path.write_text(json.dumps(config), encoding="utf-8")
PREVIEW_CONFIG
cd "$preview/repository"
LOG_LEVEL=debug RENOVATE_GITHUB_COM_TOKEN="$token" renovate --platform=local --dry-run=lookup
'''
