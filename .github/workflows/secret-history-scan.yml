---
# Weekly scan of the whole history for credentials TruffleHog can verify as live. The lint job scans new changes
# with betterleaks; this complements CI checks and any optional local staged scans.

name: Secret History Scan

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the full history
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan the history for verified secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: 3.99.8
          extra_args: --results=verified
